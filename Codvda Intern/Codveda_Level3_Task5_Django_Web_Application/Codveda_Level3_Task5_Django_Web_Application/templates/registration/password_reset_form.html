{% extends "base.html" %}
{% block title %}Password Reset | Secure Portal{% endblock %}
{% block content %}
<section class="auth-card">
    <h1>Reset password</h1>
    <p>Enter the email associated with your account.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Send reset link</button>
    </form>
</section>
{% endblock %}
